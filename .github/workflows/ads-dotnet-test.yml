name: .NET CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ./YarpGateway.sln 

      - name: Build
        run: dotnet build --no-restore --configuration Release ./YarpGateway.sln 

      - name: Run tests
        run: |
          cd Test/AccountDeletionScheduler
          dotnet test --no-build --configuration Release --logger "trx;LogFileName=test_results.trx" --results-directory TestResults

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: xUnit Account Deletion Scheduler Tests
          path: Test/AccountDeletionScheduler/TestResults/**/*.trx
          reporter: dotnet-trx