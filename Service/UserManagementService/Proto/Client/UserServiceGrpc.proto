syntax = "proto3";

option csharp_namespace = "User";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service UserServiceGrpc {
    rpc GetUserByIdForAuth (UserRequest) returns (AuthUserResponse);
    rpc GetListOfAllUsers (google.protobuf.Empty) returns (ListOfUserResponse);
    rpc FindByValueForAuth (ValueKeysRequest) returns (ValidationResponse);
    rpc RegisterUserInAuth (CreateUserRequest) returns (ValidationResponse);
    rpc UpdateOwnAccount(UpdateOwnUserDTORequest) returns (MessageResponse);
    rpc VerifyNewEmailParameters (NewEmailDTORequest) returns (ValidationResponse);
    rpc UpdateEmailAddress(UpdateEmailRequest)returns(ValidationResponse);
    rpc GetUserByEmailForAuth (UserEmailRequest) returns (ValidationResponse);
    rpc ReturnPasswordForAuth (PasswordDTORequest) returns (ValidationResponse);
    rpc DeleteAccount (UserRequest) returns (google.protobuf.Empty);
    rpc DeleteAnyAccount (UserRequest) returns (MessageResponse);
    rpc UpdatePasswordAuth (UpdatePasswordDTORequest) returns (MessageResponse);
    rpc UpdateRolesUser (UpdateRolesRequest) returns (MessageResponse);
}

message ValidationResponse {
    oneof result {
        AuthUserResponse user = 1;
        ErrorResponse error = 2;
    }
}

message ListOfUserResponse {
    repeated AuthUserResponse user = 1;
}

message MessageResponse {
    oneof result {
        string message = 1;
        ErrorResponse error = 2;
    }
}

message UserEmailRequest {
    string email = 1;
}
message UpdateEmailRequest{
    int32 id = 1;
    string new_email= 2;
}

message ValueKeysRequest{
    string key = 1;
    oneof value {
        string string_value = 2;
        int32 int_value = 3;
        bool bool_value = 4;
    }
}

message UserRequest {
    int32 id = 1;
}
message NewEmailDTORequest {
    int32 id = 1;
    string password = 2;
    string new_email = 3;
}
message UpdateOwnUserDTORequest {
    int32 id = 1;
    string password = 2;
    string full_name = 3;
    string username = 4;
}
message UpdateRolesRequest {
    int32 id = 1;
    ROLES new_roles = 2;
}
message PasswordDTORequest {
    int32 id = 1;
    string password= 2;
}
message UpdatePasswordDTORequest{
    int32 id = 1;
    string password = 2;
    string new_password = 3;
}
message CreateUserRequest {
    string full_name = 2;
    string username = 3;
    string email = 4;
    string password = 5;
    ROLES roles = 6;
}

message AuthUserResponse {
    int32 id = 1;
    string full_name = 2;
    string username = 3;
    string email = 4;
    string password = 5;
    ROLES roles = 6;
}

message ErrorResponse {
    int32 status_code = 1;
    string message = 2;
}
enum ROLES{
     ADMIN = 0;
     CREATOR = 1;
     BASIC = 2;
}