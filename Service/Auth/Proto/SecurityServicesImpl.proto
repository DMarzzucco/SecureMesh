syntax = "proto3";

option csharp_namespace = "Security.Protos";

import "google/protobuf/empty.proto";

service SecurityServiceGrpc {
    rpc FindSessionByUser (UserIdRequest) returns (SessionResponse);
    rpc SaveSession (UserIdRequest) returns (google.protobuf.Empty);
}

message UserIdRequest{
    int32 user_id = 1;
}
message SessionResponse {
    int32 id = 1;
    int32 user_id = 2;
    string ip = 3;
    string user_agent = 4;
    string location = 5;
    bool is_active = 6;
}